---
name: '☑️ Install deps'
description: 'Install dependencies and setup node'

runs:
    using: composite
    steps:
        - name: 📦 Setup pnpm
          uses: pnpm/action-setup@v6

        - name: 🖥️ Setup Node
          uses: actions/setup-node@v4
          with:
              node-version: 20
              cache: pnpm

        - name: 🔗 Install Dependencies
          shell: bash
          run: |
              pnpm install --frozen-lockfile --ignore-scripts
